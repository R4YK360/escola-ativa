<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EscolaAtiva</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f3f5;
        color: #0f1115;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      /* Modo Escuro Global */
      body.dark-mode {
        background-color: #0b0d10;
        color: #f1f3f5;
      }

      body.dark-mode .card {
        background-color: #16191f !important;
        color: #f1f3f5 !important;
        border: 1px solid #262b34 !important;
      }

      /* Garante que qualquer título ou texto escuro fica branco no modo escuro */
      body.dark-mode h1,
      body.dark-mode h2,
      body.dark-mode h3,
      body.dark-mode h4,
      body.dark-mode h5,
      body.dark-mode h6,
      body.dark-mode .text-dark,
      body.dark-mode .card-title {
        color: #f8f9fa !important;
      }

      body.dark-mode .text-muted,
      body.dark-mode .text-secondary {
        color: #9ca3af !important;
      }

      body.dark-mode .form-control,
      body.dark-mode .form-select,
      body.dark-mode .input-group-text {
        background-color: #0f1115 !important;
        color: #ffffff !important;
        border-color: #2e3440 !important;
      }

      body.dark-mode .btn-light {
        background-color: #22262f !important;
        border-color: #2e3440 !important;
        color: #f1f3f5 !important;
      }

      body.dark-mode .btn-close {
        filter: invert(1) grayscale(100%) brightness(200%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
